# FrostSight showcase Worker. Local: `npx wrangler dev --test-scheduled`, with DATABRICKS_TOKEN and any
# overrides of the vars below in .dev.vars (gitignored). Cloudflare setup comes after the local demo.
name = "frostsight-showcase"
main = "worker/src/index.ts"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[kv_namespaces]]
binding = "STATE"
id = "418fb1d713a2437aaf2421daab912269"

[triggers]
crons = ["*/15 * * * *"]

[vars]
DATABRICKS_HOST = "https://dbc-03393298-a93c.cloud.databricks.com"
DATABRICKS_WAREHOUSE_ID = "b65ed643f1b3367e"
CATALOG = "frostsight"
