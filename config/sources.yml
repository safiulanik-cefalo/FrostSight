# Source inventory: one entry per external system the collector calls.
# Verified live on 2026-09-28, DATEX WFS on 2026-10-07 (docs/source-verification.md). Secrets are never stored here;
# `secret` names the environment variable or secret-scope key the collector reads.
pilot_county: "55"   # Troms, ADR-0002

sources:
  # DATEX publications through the open WFS (ADR-0008): no account, no fixed IP.
  datex_road_weather:
    provider: Statens vegvesen
    url: https://ogckart-sn1.atlas.vegvesen.no/datex_3_1/wfs
    params: {service: WFS, version: 2.0.0, request: GetFeature, typeNames: "datex_3_1:WeatherSimple_v2", outputFormat: application/json}
    format: geojson           # mapped to contract v1 JSON lines; raw GeoJSON kept in road_weather_raw
    auth: none
    scope: national           # silver filters to the county through the station table
    cadence_minutes: 10
    landing: [road_weather, road_weather_raw, datex_sites]
    licence: NLOD             # service declares Fees NONE, AccessConstraints NONE; NLOD for the WFS to be confirmed
    attribution: Statens vegvesen
    mvp: true

  datex_incidents:
    provider: Statens vegvesen
    url: https://ogckart-sn1.atlas.vegvesen.no/datex_3_1/wfs
    params: {service: WFS, version: 2.0.0, request: GetFeature, typeNames: "datex_3_1:SituationSimple_v2", outputFormat: application/json, srsName: "EPSG:4326"}
    format: geojson
    auth: none
    scope: county_bbox        # bbox from NVDB omrader/fylker kartutsnitt for pilot_county; national is 10 MB
    cadence_minutes: 30
    landing: [road_incidents, road_incidents_raw]
    licence: NLOD
    attribution: Statens vegvesen
    mvp: true

  nvdb:
    provider: Statens vegvesen
    url: https://nvdbapiles.atlas.vegvesen.no
    format: json
    auth: header
    headers: {X-Client: frostsight}
    cadence: weekly
    object_types: {road_weather_stations: 153, traffic_stations: 482, accidents: 570, avalanche_landslide: 445, speed_limits: 105}
    landing: [nvdb_road_network, nvdb_stations, nvdb_speed_limits, nvdb_accidents, nvdb_avalanche, nvdb_counties]
    licence: NLOD
    attribution: Statens vegvesen, NVDB
    mvp: true

  frost:
    provider: MET Norway
    url: https://frost.met.no
    format: json
    auth: client_id
    secret: [FROST_CLIENT_ID]
    cadence: once             # last winter's history, chunked by month
    landing: [frost_sources, frost_history]
    licence: CC BY 4.0
    attribution: MET Norway
    mvp: true

  open_meteo_elevation:
    provider: Open-Meteo
    url: https://api.open-meteo.com/v1/elevation
    format: json
    auth: none
    cadence: once
    landing: [elevation]
    licence: CC BY 4.0
    attribution: Open-Meteo
    mvp: true
    note: Fallback for Kartverket, which was unreachable on 2026-09-28

  met_locationforecast:
    provider: MET Norway
    url: https://api.met.no/weatherapi/locationforecast/2.0/compact
    format: json
    auth: user_agent
    cadence_minutes: 60
    licence: CC BY 4.0
    attribution: MET Norway
    mvp: false

  trafikkdata:
    provider: Statens vegvesen
    url: https://trafikkdata-api.atlas.vegvesen.no/
    format: graphql
    auth: none
    cadence_minutes: 60
    licence: NLOD
    attribution: Statens vegvesen
    mvp: false
