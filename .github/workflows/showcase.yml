name: showcase

on:
  push:
    paths: ["showcase/**", "tests/unit/test_bake_sites.py", ".github/workflows/showcase.yml"]
  pull_request:
    paths: ["showcase/**", "tests/unit/test_bake_sites.py", ".github/workflows/showcase.yml"]

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: showcase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: showcase/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx vite build
      - run: npx wrangler deploy --dry-run --outdir dist-worker

  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run pytest tests/unit/test_bake_sites.py -q
      - run: uv run ruff check showcase && uv run ruff format --check showcase
