[project]
name = "frostsight"
version = "0.1.0"
description = "Winter road hazard per road segment for the Norwegian road network"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Runtime dependencies of the wheel inside a serverless job. Spark, delta and databricks-sdk
# are preinstalled there; everything else is dev-only or an extra.
dependencies = ["pyyaml>=6", "requests>=2.32"]

[project.optional-dependencies]
collector = ["databricks-sdk>=0.50", "pyproj>=3.7"]   # laptop, GitHub Actions, static-IP host
geo = ["pyproj>=3.7", "shapely>=2.0", "h3>=4.1"]      # reference job

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.11",
    "pyspark>=3.5,<4",
    "delta-spark>=3.2,<4",
    "pandas>=2.2",
    "databricks-sdk>=0.50",
    "pyproj>=3.7",
    "shapely>=2.0",
    "h3>=4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frostsight", "collector"]

[tool.ruff]
line-length = 110
target-version = "py312"
# Databricks notebooks (dbutils/spark globals, mid-file imports) are not linted.
extend-exclude = ["collector/01_ingest_bronze.py", "collector/01_ingest_bronze.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src", "."]
